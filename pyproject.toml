[project]
name = "jaga-jkn"
version = "0.1.0"
description = "AI/ML-assisted employer compliance decision-support platform for JKN"
requires-python = ">=3.12"
dependencies = []

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 100

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "ruff>=0.11,<1",
]
ml = [
    "lightgbm>=4.5,<5",
    "matplotlib>=3.9,<4",
    "numpy>=2.2,<3",
    "pandas>=2.2,<3",
    "scikit-learn>=1.6,<2",
    "scipy>=1.14,<2",
]
