[project]
name = "jaga-jkn"
version = "0.1.0"
description = "AI/ML-assisted employer compliance decision-support platform for JKN"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "pydantic>=2.9,<3",
    "uvicorn>=0.30,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 100

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "pytest>=8,<10",
    "ruff>=0.11,<1",
]
synthetic = [
    "matplotlib>=3.9,<4",
    "numpy>=2.2,<3",
    "pandas>=2.2,<3",
]
