name: ML synthetic regression and model artifact
on:
  pull_request:
    paths: ['apps/api/**', 'packages/data/**', 'packages/domain/**', 'packages/ml/**', 'pipelines/configure/**', 'pipelines/features/**', 'pipelines/training/**', 'pipelines/evaluation/**', 'pipelines/audit/**', 'tests/backend/**', 'tests/ml/**', 'scripts/build_ml_evidence.py', 'scripts/reproduce_ml_bundle.py', 'config/backend_dataset_manifest.json', 'config/ml_company_partitions.json', 'data/synthetic/curated/**', 'pyproject.toml', 'uv.lock', '.github/workflows/backend.yml', '.github/workflows/ml.yml']
  push:
    branches: [main, machine_learning, panji-ml-pipeline-fix, panji-backend-ml-serving]
    paths: ['apps/api/**', 'packages/data/**', 'packages/domain/**', 'packages/ml/**', 'pipelines/configure/**', 'pipelines/features/**', 'pipelines/training/**', 'pipelines/evaluation/**', 'pipelines/audit/**', 'tests/backend/**', 'tests/ml/**', 'scripts/build_ml_evidence.py', 'scripts/reproduce_ml_bundle.py', 'config/backend_dataset_manifest.json', 'config/ml_company_partitions.json', 'data/synthetic/curated/**', 'pyproject.toml', 'uv.lock', '.github/workflows/backend.yml', '.github/workflows/ml.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ml:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Stable numerical runs across the initial fit and extracted handoff replay.
    env:
      PYTHONHASHSEED: "0"
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      VECLIB_MAXIMUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
    strategy:
      matrix:
        python: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install uv
        run: python -m pip install uv==0.12.23
      - name: Install locked ML dependencies
        run: uv sync --locked --group ml --python ${{ matrix.python }}
      - name: Rebuild and verify complete model bundle
        run: |
          uv run --no-sync python -m pipelines.training
          uv run --no-sync python -m packages.ml.inference --input models/example_input.json
      - name: Experimental ML HTTP serving contract and trained model integration
        env:
          JAGA_REQUIRE_ML_ARTIFACT: "1"
        run: uv run --no-sync pytest tests/backend/test_experimental_ml.py -q
      - name: Capture reproducibility logs, validation and figures
        run: |
          uv run --no-sync python scripts/reproduce_ml_bundle.py
          uv run --no-sync python scripts/build_ml_evidence.py
      - uses: actions/upload-artifact@v4
        with:
          name: jaga-jkn-ml-python-${{ matrix.python }}
          path: |
            artifacts/jaga-jkn-ml-handoff.zip
            results/evidence/
            data/synthetic/ml_splits/group_time/*.csv
            data/synthetic/ml_splits/company_holdout/*.csv
          if-no-files-found: error
          retention-days: 14
