name: Backend Verification

on:
  push:
    branches: [main, panji-backend-implementation]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    name: Backend / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install locked dependencies
        run: |
          python -m pip install uv==0.12.23
          uv sync --locked --python "${{ matrix.python-version }}" --group synthetic
      - name: Lint backend and smoke harness
        run: >-
          uv run --no-sync ruff check apps/api packages/data/snapshot.py
          packages/data/case_store.py packages/domain tests/backend scripts/smoke_backend.py
      - name: Check backend formatting
        run: >-
          uv run --no-sync ruff format --check apps/api packages/data/snapshot.py
          packages/data/case_store.py packages/domain tests/backend scripts/smoke_backend.py
      - name: Backend contract, workflow and failure tests
        run: uv run --no-sync pytest tests/backend -q --junitxml=artifacts/backend-tests.xml
      - name: Real HTTP smoke with full pinned snapshot
        run: uv run --no-sync python scripts/smoke_backend.py
      - name: Synthetic pipeline regressions
        run: uv run --no-sync python -m unittest discover -s pipelines/synthetic -p 'test_*.py' -v
      - name: Governance validation and security regressions
        run: |
          uv run --no-sync python scripts/validate_governance.py
          uv run --no-sync python scripts/test_governance_security.py
      - name: Upload backend test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-tests-python-${{ matrix.python-version }}
          path: artifacts/backend-tests.xml
          if-no-files-found: warn
          retention-days: 14
