name: Synthetic Data Generation Evidence

on:
  push:
    branches: [lintang-data-contract-alignment]
    paths:
      - "pipelines/synthetic/**"
      - ".github/workflows/synthetic-data-evidence.yml"

permissions:
  contents: write

jobs:
  synthetic-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      JAGA_N_COMPANIES: "500"
      JAGA_SYNTHETIC_SEED: "42"
    steps:
      - name: Checkout exact source SHA
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Setup Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install synthetic dependencies
        run: python -m pip install "numpy>=2.2,<3" "pandas>=2.2,<3" "matplotlib>=3.9,<4"

      - name: Generate scenario, raw, curated and Power BI facts
        run: |
          set -euo pipefail
          python pipelines/synthetic/generate_dataset_bpjs.py
          sha256sum data/synthetic/scenario/*.csv data/synthetic/candidate_ml/*.csv > /tmp/before.sha256
          python pipelines/synthetic/generate_dataset_bpjs.py
          sha256sum data/synthetic/scenario/*.csv data/synthetic/candidate_ml/*.csv > /tmp/after.sha256
          diff -u /tmp/before.sha256 /tmp/after.sha256
          python pipelines/synthetic/generate_raw_dataset_bpjs.py
          python pipelines/synthetic/pipeline_cleansing_dan_disambiguasi.py
          python pipelines/synthetic/prepare_powerbi_dataset.py

      - name: Validate final data contract
        run: python pipelines/synthetic/demo_analisis_dan_validasi.py

      - name: Validate dataset quality and generate SCOBY-style reports
        run: python pipelines/synthetic/validate_dataset_quality.py

      - name: Run full synthetic regression suite
        run: python -m unittest discover -s pipelines/synthetic -p "test_*.py" -v

      - name: Build SHA + output manifest
        if: always()
        run: |
          python - <<'PY'
          from pathlib import Path
          import csv, hashlib, json, os, platform
          root = Path("data/synthetic")
          root.mkdir(parents=True, exist_ok=True)
          artifacts = []
          files = sorted(root.rglob("*.csv")) + sorted(Path("powerbi/data").glob("*.csv"))
          for path in files:
              with path.open(newline="", encoding="utf-8-sig") as handle:
                  reader = csv.reader(handle)
                  try:
                      header = next(reader)
                      row_count = sum(1 for _ in reader)
                  except StopIteration:
                      header, row_count = [], 0
              artifacts.append({
                  "path": str(path), "rows": row_count,
                  "columns": len(header), "bytes": path.stat().st_size,
                  "sha256": hashlib.sha256(path.read_bytes()).hexdigest(),
              })
          manifest = {
              "repo": os.getenv("GITHUB_REPOSITORY"),
              "source_sha": os.getenv("GITHUB_SHA"),
              "python": platform.python_version(),
              "seed": int(os.getenv("JAGA_SYNTHETIC_SEED", "42")),
              "companies_requested": int(os.getenv("JAGA_N_COMPANIES", "500")),
              "synthetic_only": True,
              "trusted_policy_authorized": False,
              "pbix_rebind": "PENDING",
              "ml_status": "CANDIDATE_ONLY",
              "artifacts": artifacts,
          }
          path = root / "generation_manifest.json"
          path.write_text(json.dumps(manifest, indent=2), encoding="utf-8")
          print("manifest entries:", len(artifacts))
          print("source SHA:", manifest["source_sha"])
          PY

      - name: Commit generated synthetic CSV and validation evidence
        # Only runs after generator, contract validator, quality profiler and tests pass.
        # Dataset-only pushes do not match this workflow's paths trigger.
        if: success() && github.ref == 'refs/heads/lintang-data-contract-alignment'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          find data/synthetic -type f -name '*.csv' -print0 |
            xargs -0 -r git add -f --
          git add -f -- data/synthetic/validation/dataset_summary.json data/synthetic/validation/data_quality_findings.md
          find powerbi/data -maxdepth 1 -type f -name '*.csv' -print0 |
            xargs -0 -r git add -f --
          if git diff --cached --quiet; then
            echo "Generated CSV files are already tracked and unchanged"
            exit 0
          fi
          echo "Staged generated artifacts:"
          git diff --cached --stat
          git commit -m "data: version seeded synthetic CSV and quality evidence"
          git push origin HEAD:refs/heads/lintang-data-contract-alignment
          echo "Generated synthetic CSV files committed to data branch"

      - name: Upload downloadable CSV bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jaga-jkn-synthetic-dataset
          path: |
            data/synthetic/**/*.csv
            data/synthetic/generation_manifest.json
            data/synthetic/validation/*.json
            data/synthetic/validation/*.md
            powerbi/data/*.csv
            reports/data_quality/*.png
          if-no-files-found: warn
          retention-days: 7
