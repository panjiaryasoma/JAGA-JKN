    title: "UU No. 24 Tahun 2011 tentang BPJS"
    authority: A0
    url: "https://peraturan.bpk.go.id/Details/39268/uu-no-24-tahun-2011"
  SRC-LAW-002:
    title: "Perpres No. 82 Tahun 2018 tentang Jaminan Kesehatan"
    authority: A0
    url: "https://peraturan.bpk.go.id/Details/94711/perpres-no-82-tahun-2018"
  SRC-LAW-003:
    title: "Perpres No. 64 Tahun 2020"
