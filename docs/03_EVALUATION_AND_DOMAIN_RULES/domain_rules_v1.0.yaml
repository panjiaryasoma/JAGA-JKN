    url: "https://peraturan.bpk.go.id/Details/136650/perpres-no-64-tahun-2020"
  SRC-LAW-004:
    title: "Perpres No. 59 Tahun 2024"
    authority: A0
    url: "https://peraturan.bpk.go.id/details/285181/perpres-no-59-tahun-2024"
  SRC-LAW-005:
    title: "PP No. 86 Tahun 2013"
    authority: A0
    url: "https://peraturan.bpk.go.id/Details/5421/pp-no-86-tahun-2013"
  SRC-LAW-006:
