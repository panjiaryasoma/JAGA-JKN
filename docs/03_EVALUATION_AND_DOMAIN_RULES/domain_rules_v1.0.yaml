rules:
  - rule_id: REG-001
    name: registration_gap_signal
    rule_type: detection
    normative_anchor:
      - SRC-LAW-001
      - SRC-LAW-001A
      - SRC-LAW-005
    required_inputs:
      - reference_worker_set
      - observed_registered_worker_set
    preconditions:
      - reference_source_authority_known
      - reference_evidence_sufficient
      - applicable_article_version_verified
    output:
      allowed: [CONSISTENT, POTENTIAL_REGISTRATION_GAP, ABSTAIN]
      prohibited_semantics: [CONFIRMED_VIOLATION, FRAUD]
    missing_data_behavior: ABSTAIN
    temporal_threshold: TBD_DOMAIN_VALIDATION
    execution_status: NON_EXECUTABLE

  - rule_id: WAGE-001
    name: wage_divergence_signal
    rule_type: detection
    normative_anchor:
      - SRC-LAW-001
      - SRC-LAW-001A
      - SRC-LAW-005
      - SRC-LAW-002
      - SRC-LAW-003
      - SRC-LAW-004
    direct_semantic_anchor: SRC-LAW-005
    required_inputs:
      - reference_wage
      - observed_reported_wage
      - applicable_policy_version
    output:
      allowed: [CONSISTENT, POTENTIAL_WAGE_DIVERGENCE, ABSTAIN]
    tolerance: TBD_DOMAIN_VALIDATION
    missing_data_behavior: ABSTAIN
    execution_status: NON_EXECUTABLE

  - rule_id: CONTRIB-001
    name: contribution_irregularity_signal
    rule_type: detection
    normative_anchor:
      - SRC-LAW-003
      - SRC-LAW-004
      - SRC-LAW-006A
      - SRC-LAW-006B
      - SRC-LAW-006
    verified_anchor:
      ppu_rate_perpres_64_2020:
        total_rate: 0.05
        employer_rate: 0.04
        participant_rate: 0.01
        note: "Historical/legal anchor; not a timeless constant without applicable-policy verification."
    required_inputs:
      - contribution_wage_basis
      - observed_payment
      - applicable_policy_version
    preconditions:
      - contribution_regulation_chain_consolidated_for_period
    output:
      allowed: [CONSISTENT, POTENTIAL_CONTRIBUTION_IRREGULARITY, ABSTAIN]
    payment_timing_threshold: TBD_DOMAIN_VALIDATION
    missing_data_behavior: ABSTAIN
    execution_status: NON_EXECUTABLE

global_invariants:
  - automated_signal_is_not_confirmed_violation
  - policy_source_and_effective_period_required
  - conflicting_authority_fails_closed
  - unknown_reference_data_causes_abstention
  - latest_amendment_is_not_assumed_to_be_consolidated_text
